<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Tailwind Random Color</title>
        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <style>
            .swipe-area {
                touch-action: none;
            }
            .color-transition {
                transition: all 0.4s ease-in-out;
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        </style>
    </head>
    <body
        class="bg-neutral-950 text-white h-dvh w-screen flex flex-col overflow-hidden overscroll-none select-none font-sans"
    >
        <header
            class="bg-neutral-950/80 backdrop-blur-xl border-b border-white/10 p-4 z-50 shrink-0 flex flex-col gap-4 shadow-xl"
        >
            <div
                class="flex flex-wrap items-center gap-2 overflow-x-auto no-scrollbar pb-1"
            >
                <span
                    class="text-white/40 text-xs font-bold uppercase tracking-widest mr-2"
                    ><i class="fa-solid fa-filter"></i> Filters:</span
                >
                <button
                    data-filter="light"
                    class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-white/30 opacity-60 hover:opacity-100 transition-all"
                >
                    <i class="fa-regular fa-sun mr-1"></i> Light
                </button>
                <button
                    data-filter="dark"
                    class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-white/30 opacity-60 hover:opacity-100 transition-all"
                >
                    <i class="fa-solid fa-moon mr-1"></i> Dark
                </button>
                <button
                    data-filter="cold"
                    class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-white/30 opacity-60 hover:opacity-100 transition-all"
                >
                    <i class="fa-solid fa-snowflake mr-1"></i> Cold
                </button>
                <button
                    data-filter="warm"
                    class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-white/30 opacity-60 hover:opacity-100 transition-all"
                >
                    <i class="fa-solid fa-fire mr-1"></i> Warm
                </button>

                <span
                    id="colorCount"
                    class="ml-auto text-xs font-mono text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded-md"
                    >Loading...</span
                >
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <span
                    class="text-white/40 text-xs font-bold uppercase tracking-widest mr-2"
                    ><i class="fa-solid fa-layer-group"></i> Mode:</span
                >
                <div class="flex bg-white/10 rounded-lg p-1">
                    <button
                        id="btnSolid"
                        class="mode-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-white text-black shadow-sm transition-all"
                        data-mode="solid"
                    >
                        <i class="fa-solid fa-square-full mr-1"></i> Solid
                    </button>
                    <button
                        id="btnGradient"
                        class="mode-btn px-3 py-1.5 rounded-md text-xs font-semibold text-white/60 hover:text-white transition-all"
                        data-mode="gradient"
                    >
                        <i class="fa-solid fa-circle-half-stroke mr-1"></i>
                        Gradient
                    </button>
                    <button
                        id="btnMix"
                        class="mode-btn px-3 py-1.5 rounded-md text-xs font-semibold text-white/60 hover:text-white transition-all"
                        data-mode="mix"
                    >
                        <i class="fa-solid fa-blender mr-1"></i> Mix Grad
                    </button>
                </div>
                <select
                    id="gradDir"
                    class="hidden ml-2 bg-black/50 text-white text-xs border border-white/20 rounded-lg px-3 py-2 outline-none focus:border-emerald-500 transition-colors cursor-pointer appearance-none text-center"
                >
                    <option value="to-t">↑&#xFE0E; to-t</option>
                    <option value="to-tr">↗&#xFE0E; to-tr</option>
                    <option value="to-r">→&#xFE0E; to-r</option>
                    <option value="to-br" selected>↘&#xFE0E; to-br</option>
                    <option value="to-b">↓&#xFE0E; to-b</option>
                    <option value="to-bl">↙&#xFE0E; to-bl</option>
                    <option value="to-l">←&#xFE0E; to-l</option>
                    <option value="to-tl">↖&#xFE0E; to-tl</option>
                </select>
            </div>
        </header>

        <main
            id="swipeContainer"
            class="swipe-area flex-1 relative w-full flex flex-col items-center justify-center p-6 color-transition cursor-crosshair"
        >
            <div
                class="text-center z-10 pointer-events-none flex flex-col items-center"
            >
                <div
                    id="classDisplay"
                    class="font-mono text-xl md:text-3xl font-bold bg-neutral-950/60 backdrop-blur-md border border-white/20 px-8 py-5 rounded-2xl inline-block shadow-2xl transition-colors text-white max-w-full break-words"
                >
                    bg-slate-900
                </div>

                <div
                    id="toast"
                    class="opacity-0 transition-all duration-300 transform translate-y-4 absolute left-1/2 -translate-x-1/2 mt-6 bg-emerald-500 text-white text-sm font-bold px-6 py-2 rounded-full shadow-[0_0_20px_rgba(16,185,129,0.5)] flex items-center gap-2"
                >
                    <i class="fa-solid fa-check"></i> Copied to Clipboard!
                </div>
            </div>

            <div
                class="absolute bottom-8 left-0 w-full flex justify-center gap-12 text-xs font-medium uppercase tracking-widest opacity-40 pointer-events-none"
            >
                <div class="flex flex-col items-center gap-2">
                    <i class="fa-solid fa-arrows-left-right text-lg"></i>
                    <span>Swipe / Scroll</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <i
                        class="fa-solid fa-hand-pointer text-lg animate-bounce"
                    ></i>
                    <span>Swipe Up to Copy</span>
                </div>
            </div>
        </main>

        <script src="script.js"></script>
    </body>
</html>
